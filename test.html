<!DOCTYPE html>
<html>
<head>
    <title>Calculator Test</title>
</head>
<body>
    <script>
        // Test the calculator's expression evaluation
        function testCalculator() {
            // Test basic operations
            console.log('Testing basic operations...');
            console.log('2 + 3 =', 2 + 3);
            console.log('10 - 4 =', 10 - 4);
            console.log('6 * 7 =', 6 * 7);
            console.log('15 / 3 =', 15 / 3);
            
            // Test scientific functions
            console.log('\nTesting scientific functions...');
            console.log('sin(Math.PI/2) =', Math.sin(Math.PI/2));
            console.log('cos(0) =', Math.cos(0));
            console.log('sqrt(16) =', Math.sqrt(16));
            console.log('log10(100) =', Math.log10(100));
            console.log('Math.PI =', Math.PI);
            console.log('Math.E =', Math.E);
            
            console.log('\nAll tests completed successfully!');
        }
        
        testCalculator();
    </script>
</body>
</html>
